[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.gd"]

[phases.install]
cmds = ["cd canteen-management && composer install --no-dev --optimize-autoloader || echo 'No composer lock file'"]

[phases.build]
cmds = ["echo 'PHP app ready'"]

[start]
cmd = "cd canteen-management && php -S 0.0.0.0:$PORT -t ."
