[build]
builder = "NIXPACKS"
buildCommand = "cd canteen-management && composer install --no-dev --optimize-autoloader || echo 'No composer deps'"

[deploy]
startCommand = "cd canteen-management && php -S 0.0.0.0:$PORT -t ."
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[build.nixpacksPlan]
providers = ["php"]
